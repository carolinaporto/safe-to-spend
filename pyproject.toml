[project]
name = "safe-to-spend"
version = "0.1.0"
description = "Personal finance web app for an academic year abroad"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/Header() in defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
# `alembic/` is a migrations dir, not our package — `import alembic` is the lib.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]
"backend/seed.py" = ["E501"]  # wide literal tables of demo data
