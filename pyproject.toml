[project]
name = "safe-to-spend"
version = "0.1.0"
description = "Personal finance web app for an academic year abroad"
requires-python = ">=3.12,<3.13"

dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.32",     # CSV upload (>=0.0.31: multipart DoS CVEs)
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.13",
  "PyJWT==2.13.0",                 # >=2.12.1: token-validation CVEs
  "bcrypt==4.2.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.16.5",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/Header() in defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
# `alembic/` is a migrations dir, not our package — `import alembic` is the lib.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]
"backend/seed.py" = ["E501"]  # wide literal tables of demo data
